name: taller_3ercorte
description: Taller Flutter - API COVID y notificaciones locales.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Cliente HTTP para consultar la API
  http: ^1.2.0

  # Notificaciones locales (versión 19, la que usa esta guía)
  flutter_local_notifications: ^19.0.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true